[project]
name = "document-lab"
version = "0.1.0"
description = "A local laboratory for document image extraction experiments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7", "pydantic-settings>=2.2", "PyYAML>=6.0", "httpx>=0.27",
  "Pillow>=10.0", "PyMuPDF>=1.24", "opencv-python-headless>=4.9", "numpy>=1.26", "jiwer>=3.0",
  "psutil>=5.9", "pynvml>=11.5", "mlflow>=2.12", "rich>=13.7", "typer>=0.12",
  "jupyterlab>=4.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10", "respx>=0.21"]

[project.scripts]
document-lab = "document_lab.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/document_lab"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.coverage.run]
source = ["document_lab"]
