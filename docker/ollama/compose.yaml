services:
  ollama:
    build:
      context: ../..
      dockerfile: docker/ollama/Dockerfile
    ports:
      - "11434:11434"
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3-vl:4b-instruct}
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_models:
