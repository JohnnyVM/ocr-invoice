services:
  ollama:
    build:
      context: ../..
      dockerfile: docker/ollama/Dockerfile
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3-vl:4b-instruct}
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_models: